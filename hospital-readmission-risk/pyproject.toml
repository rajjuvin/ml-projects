[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readmission"
version = "0.1.0"
description = "30-day hospital readmission risk prediction for diabetic inpatient encounters (retrospective prototype)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "scikit-learn>=1.9",
    "xgboost>=3.4",
    "joblib>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[project.scripts]
readmission-train = "readmission.train:main"
readmission-compare = "readmission.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
