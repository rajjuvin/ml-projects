[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readmission"
dynamic = ["version"]  # read from src/readmission/__init__.py, the one place the version is written
description = "30-day hospital readmission risk prediction for diabetic inpatient encounters (retrospective prototype)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "scikit-learn>=1.9",
    "xgboost>=3.4",
    "joblib>=1.6",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "httpx>=0.28"]

[project.scripts]
readmission-train = "readmission.train:main"
readmission-compare = "readmission.compare:main"
readmission-tune = "readmission.tune:main"
readmission-serve = "readmission.app:main"

[tool.setuptools.dynamic]
version = {attr = "readmission.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readmission = ["web/*.html", "web/*.csv", "web/*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
