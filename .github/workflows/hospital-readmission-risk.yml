name: hospital-readmission-risk

on:
  push:
    paths:
      - "hospital-readmission-risk/**"
      - ".github/workflows/hospital-readmission-risk.yml"
  pull_request:
    paths:
      - "hospital-readmission-risk/**"
      - ".github/workflows/hospital-readmission-risk.yml"

defaults:
  run:
    working-directory: hospital-readmission-risk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hospital-readmission-risk/requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt pytest ruff httpx
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
